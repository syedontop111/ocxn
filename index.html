<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>oclxn - by Syed Developers</title>
        <meta name="description" content="oclxn - Advanced AI Assistant by Syed Developers. Created by Syed Haider Hussein. Powered by real AI intelligence." />
        <meta name="author" content="Syed Haider Hussein | Syed Developers" />
        <!-- DO NOT UPDATE THESE SCRIPTS IMPORTS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <style type="text/tailwindcss">
            @layer base {
                * { border-color: var(--border); }
                body {
                    background-color: var(--background);
                    color: var(--foreground);
                    font-family: "Inter", sans-serif;
                }
            }
            @theme inline {
                --color-background: var(--background);
                --color-foreground: var(--foreground);
                --color-card: var(--card);
                --color-card-foreground: var(--card-foreground);
                --color-popover: var(--popover);
                --color-popover-foreground: var(--popover-foreground);
                --color-primary: var(--primary);
                --color-primary-foreground: var(--primary-foreground);
                --color-secondary: var(--secondary);
                --color-secondary-foreground: var(--secondary-foreground);
                --color-muted: var(--muted);
                --color-muted-foreground: var(--muted-foreground);
                --color-accent: var(--accent);
                --color-accent-foreground: var(--accent-foreground);
                --color-destructive: var(--destructive);
                --color-border: var(--border);
                --color-input: var(--input);
                --color-ring: var(--ring);
                --color-sidebar: var(--sidebar);
                --color-sidebar-foreground: var(--sidebar-foreground);
                --color-sidebar-primary: var(--sidebar-primary);
                --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
                --color-sidebar-accent: var(--sidebar-accent);
                --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
                --color-sidebar-border: var(--sidebar-border);
                --color-sidebar-ring: var(--sidebar-ring);
                --radius-sm: calc(var(--radius) - 4px);
                --radius-md: calc(var(--radius) - 2px);
                --radius-lg: var(--radius);
                --radius-xl: calc(var(--radius) + 4px);
                --animate-caret-blink: caret-blink 1.25s ease-out infinite;
                @keyframes caret-blink {
                    0%, 70%, 100% { opacity: 1; }
                    20%, 50% { opacity: 0; }
                }
            }
            :root {
                --radius: 0.75rem;
                --background: #fafafa;
                --foreground: #18181b;
                --card: #ffffff;
                --card-foreground: #18181b;
                --popover: #ffffff;
                --popover-foreground: #18181b;
                --primary: #6d28d9;
                --primary-foreground: #fafafa;
                --secondary: #f4f4f5;
                --secondary-foreground: #18181b;
                --muted: #f4f4f5;
                --muted-foreground: #71717a;
                --accent: #f4f4f5;
                --accent-foreground: #18181b;
                --destructive: #ef4444;
                --destructive-foreground: #fafafa;
                --border: #e4e4e7;
                --input: #e4e4e7;
                --ring: #6d28d9;
                --sidebar: #ffffff;
                --sidebar-foreground: #18181b;
                --sidebar-primary: #6d28d9;
                --sidebar-primary-foreground: #fafafa;
                --sidebar-accent: #f4f4f5;
                --sidebar-accent-foreground: #18181b;
                --sidebar-border: #e4e4e7;
                --sidebar-ring: #6d28d9;
            }
            .dark {
                --background: #09090b;
                --foreground: #fafafa;
                --card: #09090b;
                --card-foreground: #fafafa;
                --popover: #09090b;
                --popover-foreground: #fafafa;
                --primary: #a78bfa;
                --primary-foreground: #09090b;
                --secondary: #27272a;
                --secondary-foreground: #fafafa;
                --muted: #27272a;
                --muted-foreground: #a1a1aa;
                --accent: #27272a;
                --accent-foreground: #fafafa;
                --destructive: #7f1d1d;
                --destructive-foreground: #fafafa;
                --border: #27272a;
                --input: #27272a;
                --ring: #a78bfa;
                --sidebar: #09090b;
                --sidebar-foreground: #fafafa;
                --sidebar-primary: #a78bfa;
                --sidebar-primary-foreground: #09090b;
                --sidebar-accent: #27272a;
                --sidebar-accent-foreground: #fafafa;
                --sidebar-border: #27272a;
                --sidebar-ring: #a78bfa;
            }
            * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
            *::-webkit-scrollbar { width: 6px; height: 6px; }
            *::-webkit-scrollbar-track { background: transparent; }
            *::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 9999px; }
            *::-webkit-scrollbar-thumb:hover { background-color: var(--muted-foreground); }
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            .typing-cursor::after {
                content: "▋";
                display: inline-block;
                vertical-align: bottom;
                animation: caret-blink 1s step-end infinite;
                color: var(--primary);
                font-size: 0.8em;
                margin-left: 2px;
            }
            .sidebar-overlay {
                position: fixed; inset: 0;
                background-color: rgba(0,0,0,0.5);
                z-index: 40; opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }
            .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
            @media (max-width: 768px) {
                .mobile-sidebar {
                    position: fixed !important;
                    top: 0; left: 0; height: 100vh;
                    z-index: 50;
                    transform: translateX(-100%);
                    transition: transform 0.3s ease-in-out;
                }
                .mobile-sidebar.open { transform: translateX(0); }
            }
            /* Code block styling */
            pre { background: var(--muted); border-radius: 0.5rem; padding: 1rem; overflow-x: auto; margin: 0.5rem 0; border: 1px solid var(--border); }
            code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.85em; }
            pre code { background: none; padding: 0; }
            :not(pre) > code { background: var(--muted); padding: 0.15em 0.4em; border-radius: 0.25rem; border: 1px solid var(--border); }
            /* Gradient logo text */
            .logo-gradient { background: linear-gradient(135deg, #7c3aed, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
            /* Glow button */
            .glow-btn { box-shadow: 0 0 20px rgba(109, 40, 217, 0.35); }
            .dark .glow-btn { box-shadow: 0 0 20px rgba(167, 139, 250, 0.35); }
            /* Welcome screen */
            @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
            .float-anim { animation: float 3s ease-in-out infinite; }
            /* Pulse dot */
            @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
            .thinking-dot:nth-child(1){animation:pulse-dot 1.2s infinite 0s}
            .thinking-dot:nth-child(2){animation:pulse-dot 1.2s infinite 0.2s}
            .thinking-dot:nth-child(3){animation:pulse-dot 1.2s infinite 0.4s}
            /* Prose styles */
            .ai-prose h1,.ai-prose h2,.ai-prose h3{font-weight:600;margin:0.75rem 0 0.4rem;line-height:1.3}
            .ai-prose h1{font-size:1.2em}.ai-prose h2{font-size:1.1em}.ai-prose h3{font-size:1em}
            .ai-prose p{margin:0.4rem 0;line-height:1.7}
            .ai-prose ul,.ai-prose ol{padding-left:1.4rem;margin:0.4rem 0}
            .ai-prose li{margin:0.2rem 0;line-height:1.6}
            .ai-prose strong{font-weight:600}
            .ai-prose a{color:var(--primary);text-decoration:underline}
            .ai-prose blockquote{border-left:3px solid var(--primary);padding-left:0.8rem;margin:0.5rem 0;color:var(--muted-foreground);font-style:italic}
            .ai-prose table{width:100%;border-collapse:collapse;margin:0.5rem 0;font-size:0.9em}
            .ai-prose th,.ai-prose td{border:1px solid var(--border);padding:0.4rem 0.7rem;text-align:left}
            .ai-prose th{background:var(--muted);font-weight:600}
            .ai-prose hr{border:none;border-top:1px solid var(--border);margin:0.8rem 0}
        </style>
        <script type="importmap">
            {
                "imports": {
                    "react": "https://esm.sh/react@18.2.0",
                    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                    "lucide-react": "https://esm.sh/lucide-react@latest?deps=react@18.2.0",
                    "esm-shadcn": "https://esm.sh/esm-shadcn@0.0.2?deps=react@18.2.0",
                    "clsx": "https://esm.sh/clsx@2.1.0",
                    "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
                    "next-themes": "https://esm.sh/next-themes@latest?deps=react@18.2.0",
                    "marked": "https://esm.sh/marked@9.1.6"
                }
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
    </head>
    <body>
        <div id="root"></div>
        <!-- USE BABEL ONLY LIKE THIS. DO NOT MODIFY THIS IN ANY CASE -->
        <script type="text/babel" data-type="module">
            import React, { useState, useEffect, useRef, useCallback } from "react";
            import { createRoot } from "react-dom/client";
            import { ThemeProvider, useTheme } from "next-themes";
            import { marked } from "marked";
            import {
                Send, Menu, Search, MessageSquare, Bookmark, Box, Plus, Settings,
                Trash2, Archive, Maximize2, MoreHorizontal, RefreshCw, Copy, Share2,
                CheckCircle2, ChevronRight, PanelLeft, PanelRight, Bot, User, Library,
                Grid, X, Moon, Sun, Laptop, Command, GripVertical, Info, History,
                Sparkles, ArrowUpRight, Mic, Paperclip, ChevronDown, Check, File,
                ExternalLink, Pin, PinOff, Edit3, Zap, Globe, Brain, Code, Wand2,
                ThumbsUp, ThumbsDown, StopCircle, AlertCircle
            } from "lucide-react";
            import {
                Button, Card, Input, Separator, Avatar, AvatarFallback, AvatarImage,
                ScrollArea, Textarea, Badge, Tooltip, TooltipContent, TooltipProvider,
                TooltipTrigger, DropdownMenu, DropdownMenuContent, DropdownMenuItem,
                DropdownMenuLabel, DropdownMenuSeparator, DropdownMenuTrigger,
            } from "esm-shadcn";
            import { clsx } from "clsx";
            import { twMerge } from "tailwind-merge";

            function cn(...inputs) { return twMerge(clsx(inputs)); }

            // Configure marked for safe HTML rendering
            marked.setOptions({ breaks: true, gfm: true });

            // ─── API CONFIG ───────────────────────────────────────────────────────────
            const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";
            const MODEL = "llama-3.3-70b-versatile";
            const SYSTEM_PROMPT = `You are oclxn, an advanced AI assistant created by Syed Haider Hussein and Syed Developers. You are helpful, intelligent, and concise. You can help with coding, writing, analysis, math, creative tasks, and much more. When writing code, always use proper markdown code blocks with the language specified. Format your responses with markdown for readability. Be conversational yet professional.`;

            // ─── CALL GROQ API (streaming, OpenAI-compatible) ────────────────────────
            async function callClaudeAPI(messages, onChunk, signal) {
                const payload = {
                    model: MODEL,
                    max_tokens: 1024,
                    stream: true,
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT },
                        ...messages.map(m => ({ role: m.role === "ai" ? "assistant" : "user", content: m.content }))
                    ]
                };
                const res = await fetch(GROQ_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${sessionStorage.getItem("oclxn_key")}`
                    },
                    body: JSON.stringify(payload),
                    signal
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err?.error?.message || `API error ${res.status}`);
                }
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                let buffer = "";
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        const data = line.slice(6).trim();
                        if (data === "[DONE]") continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullText += delta;
                                onChunk(fullText);
                            }
                        } catch (_) {}
                    }
                }
                return fullText;
            }

            // ─── LOGO ─────────────────────────────────────────────────────────────────
            const Logo = () => (
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-500/30">
                    <span className="text-white font-black text-xs tracking-tighter">OX</span>
                </div>
            );

            // ─── SIDEBAR ITEM ─────────────────────────────────────────────────────────
            const SidebarItem = ({ icon: Icon, label, shortcut, active, count, onClick }) => (
                <button onClick={onClick} className={cn(
                    "w-full flex items-center justify-between px-3 py-2.5 rounded-md transition-all duration-200 text-sm group",
                    active ? "bg-primary/10 text-primary font-medium" : "text-muted-foreground hover:bg-muted hover:text-foreground"
                )}>
                    <div className="flex items-center gap-3">
                        <Icon className={cn("w-4 h-4", active ? "text-primary" : "text-muted-foreground group-hover:text-foreground")} />
                        <span>{label}</span>
                    </div>
                    <div className="flex items-center gap-2">
                        {count && <span className={cn("text-[10px] px-1.5 py-0.5 rounded-full font-semibold border",
                            active ? "bg-background border-primary/20 text-primary" : "bg-muted border-transparent text-muted-foreground")}>{count}</span>}
                        {shortcut && <span className="hidden group-hover:block text-[10px] bg-background border border-border px-1.5 py-0.5 rounded text-muted-foreground">{shortcut}</span>}
                    </div>
                </button>
            );

            // ─── HISTORY ITEM ─────────────────────────────────────────────────────────
            const HistoryItem = ({ label, active, isPinned, onPin, onUnpin, onDelete, onClick }) => (
                <div className="group relative">
                    <button onClick={onClick} className={cn(
                        "w-full text-left text-sm rounded-md px-3 py-2 pr-8 truncate transition-all",
                        active ? "bg-accent text-accent-foreground font-medium" : "text-muted-foreground hover:text-foreground hover:bg-muted/50"
                    )}>{label}</button>
                    <DropdownMenu>
                        <DropdownMenuTrigger asChild>
                            <button className="absolute right-1 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-muted">
                                <MoreHorizontal className="w-4 h-4 text-muted-foreground" />
                            </button>
                        </DropdownMenuTrigger>
                        <DropdownMenuContent align="end" className="w-48">
                            {isPinned
                                ? <DropdownMenuItem onClick={onUnpin}><PinOff className="w-4 h-4 mr-2" /> Unpin</DropdownMenuItem>
                                : <DropdownMenuItem onClick={onPin}><Pin className="w-4 h-4 mr-2" /> Pin</DropdownMenuItem>}
                            <DropdownMenuItem><Edit3 className="w-4 h-4 mr-2" /> Rename</DropdownMenuItem>
                            <DropdownMenuItem><Archive className="w-4 h-4 mr-2" /> Archive</DropdownMenuItem>
                            <DropdownMenuSeparator />
                            <DropdownMenuItem className="text-destructive" onClick={onDelete}><Trash2 className="w-4 h-4 mr-2" /> Delete</DropdownMenuItem>
                        </DropdownMenuContent>
                    </DropdownMenu>
                </div>
            );

            // ─── AI RESPONSE RENDERER ─────────────────────────────────────────────────
            const AIResponse = ({ content, isStreaming, onCopy, onRegenerate }) => {
                const [copied, setCopied] = useState(false);
                const html = marked.parse(content || "");

                const handleCopy = () => {
                    navigator.clipboard.writeText(content).then(() => {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                    });
                };

                return (
                    <div className="space-y-3 w-full">
                        <div
                            className={cn("ai-prose text-sm leading-relaxed text-foreground/90", isStreaming && "typing-cursor")}
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                        {!isStreaming && (
                            <div className="flex items-center gap-1.5 pt-1 animate-in fade-in duration-500">
                                <TooltipProvider>
                                    <Tooltip>
                                        <TooltipTrigger asChild>
                                            <Button variant="outline" size="sm" className="h-7 px-2.5 text-xs gap-1.5 text-muted-foreground hover:text-foreground" onClick={handleCopy}>
                                                {copied ? <Check className="w-3 h-3 text-green-500" /> : <Copy className="w-3 h-3" />}
                                                {copied ? "Copied!" : "Copy"}
                                            </Button>
                                        </TooltipTrigger>
                                        <TooltipContent>Copy response</TooltipContent>
                                    </Tooltip>
                                </TooltipProvider>
                                <TooltipProvider>
                                    <Tooltip>
                                        <TooltipTrigger asChild>
                                            <Button variant="ghost" size="icon" className="h-7 w-7 text-muted-foreground hover:text-foreground" onClick={onRegenerate}>
                                                <RefreshCw className="w-3.5 h-3.5" />
                                            </Button>
                                        </TooltipTrigger>
                                        <TooltipContent>Regenerate</TooltipContent>
                                    </Tooltip>
                                </TooltipProvider>
                                <TooltipProvider>
                                    <Tooltip>
                                        <TooltipTrigger asChild>
                                            <Button variant="ghost" size="icon" className="h-7 w-7 text-muted-foreground hover:text-green-500">
                                                <ThumbsUp className="w-3.5 h-3.5" />
                                            </Button>
                                        </TooltipTrigger>
                                        <TooltipContent>Good response</TooltipContent>
                                    </Tooltip>
                                </TooltipProvider>
                                <TooltipProvider>
                                    <Tooltip>
                                        <TooltipTrigger asChild>
                                            <Button variant="ghost" size="icon" className="h-7 w-7 text-muted-foreground hover:text-red-500">
                                                <ThumbsDown className="w-3.5 h-3.5" />
                                            </Button>
                                        </TooltipTrigger>
                                        <TooltipContent>Bad response</TooltipContent>
                                    </Tooltip>
                                </TooltipProvider>
                            </div>
                        )}
                    </div>
                );
            };

            // ─── CHAT MESSAGE ─────────────────────────────────────────────────────────
            const ChatMessage = ({ message, isLast, isStreaming, onRegenerate }) => {
                const isUser = message.role === "user";
                return (
                    <div className={cn("group flex gap-3 w-full animate-in slide-in-from-bottom-2 duration-300", isUser ? "justify-end" : "justify-start")}>
                        {!isUser && (
                            <div className="h-8 w-8 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shadow-sm mt-0.5 shrink-0">
                                <span className="text-white font-black text-[10px]">OX</span>
                            </div>
                        )}
                        <div className={cn("flex flex-col max-w-[88%] sm:max-w-[82%] lg:max-w-2xl", isUser ? "items-end" : "items-start")}>
                            <div className="flex items-center gap-2 mb-1 px-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <span className="text-xs font-medium text-foreground">{isUser ? "You" : "oclxn"}</span>
                                <span className="text-[10px] text-muted-foreground">{message.timestamp}</span>
                            </div>
                            <div className={cn(
                                "relative px-4 py-3 shadow-sm text-sm",
                                isUser
                                    ? "bg-gradient-to-br from-violet-600 to-indigo-600 text-white rounded-2xl rounded-tr-sm"
                                    : "bg-card border border-border rounded-2xl rounded-tl-sm w-full"
                            )}>
                                {message.role === "error" ? (
                                    <div className="flex items-center gap-2 text-red-500 text-sm">
                                        <AlertCircle className="w-4 h-4 shrink-0" />
                                        <span>{message.content}</span>
                                    </div>
                                ) : isUser ? (
                                    <p className="whitespace-pre-wrap text-[13px] sm:text-sm leading-relaxed">{message.content}</p>
                                ) : (
                                    <AIResponse
                                        content={message.content}
                                        isStreaming={isLast && isStreaming}
                                        onRegenerate={onRegenerate}
                                    />
                                )}
                            </div>
                        </div>
                        {isUser && (
                            <Avatar className="h-8 w-8 border border-border mt-0.5 shrink-0">
                                <AvatarFallback className="bg-muted text-foreground text-xs font-bold">ME</AvatarFallback>
                            </Avatar>
                        )}
                    </div>
                );
            };

            // ─── THINKING INDICATOR ───────────────────────────────────────────────────
            const ThinkingIndicator = () => (
                <div className="flex gap-3 w-full animate-in slide-in-from-bottom-2 duration-300">
                    <div className="h-8 w-8 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shadow-sm mt-0.5 shrink-0">
                        <span className="text-white font-black text-[10px]">OX</span>
                    </div>
                    <div className="bg-card border border-border rounded-2xl rounded-tl-sm px-5 py-4 flex items-center gap-1.5">
                        <div className="thinking-dot w-2 h-2 rounded-full bg-primary"></div>
                        <div className="thinking-dot w-2 h-2 rounded-full bg-primary"></div>
                        <div className="thinking-dot w-2 h-2 rounded-full bg-primary"></div>
                    </div>
                </div>
            );

            // ─── WELCOME SCREEN ───────────────────────────────────────────────────────
            const WelcomeScreen = ({ onPrompt }) => {
                const suggestions = [
                    { icon: Code, text: "Write a Python web scraper", color: "text-blue-500" },
                    { icon: Brain, text: "Explain quantum computing simply", color: "text-purple-500" },
                    { icon: Globe, text: "What's happening in tech today?", color: "text-green-500" },
                    { icon: Wand2, text: "Write a creative short story", color: "text-orange-500" },
                ];
                return (
                    <div className="flex flex-col items-center justify-center h-full px-4 text-center">
                        <div className="float-anim mb-6">
                            <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shadow-2xl shadow-violet-500/30 mx-auto">
                                <span className="text-white font-black text-2xl tracking-tighter">OX</span>
                            </div>
                        </div>
                        <h1 className="text-3xl font-bold mb-2">
                            <span className="logo-gradient">oclxn</span>
                        </h1>
                        <p className="text-muted-foreground text-sm mb-1">by <span className="font-semibold text-foreground">Syed Developers</span></p>
                        <p className="text-muted-foreground text-xs mb-8">Created by Syed Haider Hussein · Powered by real AI</p>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-xl">
                            {suggestions.map((s, i) => (
                                <button key={i} onClick={() => onPrompt(s.text)}
                                    className="flex items-center gap-3 p-3.5 rounded-xl border border-border bg-card hover:bg-muted/60 hover:border-primary/30 transition-all text-left group shadow-sm hover:shadow-md">
                                    <div className={cn("p-2 rounded-lg bg-muted group-hover:bg-background transition-colors", s.color)}>
                                        <s.icon className="w-4 h-4" />
                                    </div>
                                    <span className="text-sm font-medium text-foreground">{s.text}</span>
                                    <ArrowUpRight className="w-3.5 h-3.5 text-muted-foreground ml-auto opacity-0 group-hover:opacity-100 transition-opacity" />
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            // ─── API KEY MODAL ────────────────────────────────────────────────────────
            const ApiKeyModal = ({ onSave }) => {
                const [key, setKey] = useState("");
                const isValid = key.startsWith("gsk_") && key.length > 20;
                return (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                        <div className="bg-card border border-border rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center">
                                    <span className="text-white font-black text-xs">OX</span>
                                </div>
                                <div>
                                    <h2 className="font-bold text-foreground">Connect oclxn</h2>
                                    <p className="text-xs text-muted-foreground">Enter your Groq API key (free!)</p>
                                </div>
                            </div>
                            <p className="text-xs text-muted-foreground mb-4 leading-relaxed">
                                100% free — no credit card needed. Get your free key at{" "}
                                <a href="https://console.groq.com/keys" target="_blank" className="text-primary underline">console.groq.com/keys</a>.
                                Your key starts with <code className="bg-muted px-1 rounded text-[11px]">gsk_</code>
                            </p>
                            <Input
                                type="password"
                                placeholder="gsk_..."
                                value={key}
                                onChange={e => setKey(e.target.value)}
                                onKeyDown={e => e.key === "Enter" && isValid && onSave(key.trim())}
                                className="mb-2 font-mono text-xs"
                                autoFocus
                            />
                            {key.length > 5 && !isValid && (
                                <p className="text-xs text-red-500 mb-2">Key must start with gsk_ — copy it from console.groq.com/keys</p>
                            )}
                            <Button
                                className="w-full glow-btn bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white border-0 mt-1"
                                onClick={() => isValid && onSave(key.trim())}
                                disabled={!isValid}
                            >
                                <Zap className="w-4 h-4 mr-2" /> Start Chatting Free
                            </Button>
                            <p className="text-[10px] text-muted-foreground text-center mt-3">oclxn by Syed Developers · Created by Syed Haider Hussein</p>
                        </div>
                    </div>
                );
            };

            // ─── MAIN APP ─────────────────────────────────────────────────────────────
            function App() {
                const [apiKey, setApiKey] = useState(sessionStorage.getItem("oclxn_key") || "");
                const [leftOpen, setLeftOpen] = useState(false);
                const [rightOpen, setRightOpen] = useState(false);
                const [isMobile, setIsMobile] = useState(false);
                const [activeTab, setActiveTab] = useState("chats");
                const [inputValue, setInputValue] = useState("");
                const [isThinking, setIsThinking] = useState(false);
                const [isStreaming, setIsStreaming] = useState(false);
                const [searchQuery, setSearchQuery] = useState("");
                const [activeChat, setActiveChat] = useState("new");
                const [messages, setMessages] = useState([]);
                const [abortCtrl, setAbortCtrl] = useState(null);
                const scrollRef = useRef(null);
                const textareaRef = useRef(null);
                const { theme, setTheme } = useTheme();

                const [chats, setChats] = useState([
                    { id: "c1", label: "Getting started with oclxn", pinned: true, time: "Just now" },
                    { id: "c2", label: "Python web scraper help", pinned: false, time: "1 hour ago" },
                    { id: "c3", label: "Creative writing project", pinned: false, time: "Yesterday" },
                    { id: "c4", label: "React component architecture", pinned: false, time: "2 days ago" },
                    { id: "c5", label: "Investment strategies", pinned: false, time: "3 days ago" },
                ]);

                useEffect(() => {
                    const check = () => {
                        const m = window.innerWidth < 768;
                        setIsMobile(m);
                        setLeftOpen(!m);
                        if (m) setRightOpen(false);
                    };
                    check();
                    window.addEventListener("resize", check);
                    return () => window.removeEventListener("resize", check);
                }, []);

                useEffect(() => {
                    if (scrollRef.current) {
                        scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
                    }
                }, [messages, isThinking]);

                const saveKey = (k) => {
                    sessionStorage.setItem("oclxn_key", k);
                    setApiKey(k);
                };

                const handleNewChat = () => {
                    setMessages([]);
                    setActiveChat("new");
                    if (isMobile) setLeftOpen(false);
                    textareaRef.current?.focus();
                };

                const handleSelectChat = (id) => {
                    setActiveChat(id);
                    setMessages([]);
                    if (isMobile) setLeftOpen(false);
                };

                const handleStop = () => {
                    abortCtrl?.abort();
                    setIsThinking(false);
                    setIsStreaming(false);
                };

                const sendMessage = useCallback(async (text) => {
                    if (!text.trim() || isThinking || isStreaming) return;
                    const userMsg = {
                        id: Date.now(),
                        role: "user",
                        content: text.trim(),
                        timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                    };
                    const updatedMessages = [...messages, userMsg];
                    setMessages(updatedMessages);
                    setInputValue("");
                    setIsThinking(true);

                    // Auto-title the new chat
                    if (messages.length === 0) {
                        const title = text.trim().slice(0, 42) + (text.length > 42 ? "…" : "");
                        const newId = "c" + Date.now();
                        setActiveChat(newId);
                        setChats(prev => [{ id: newId, label: title, pinned: false, time: "Just now" }, ...prev]);
                    }

                    const ctrl = new AbortController();
                    setAbortCtrl(ctrl);

                    try {
                        const aiMsg = {
                            id: Date.now() + 1,
                            role: "ai",
                            content: "",
                            timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                        };
                        setMessages(prev => [...prev, aiMsg]);
                        setIsThinking(false);
                        setIsStreaming(true);

                        // Build conversation history (exclude the empty AI placeholder)
                        const historyForAPI = updatedMessages;

                        await callClaudeAPI(
                            historyForAPI,
                            (chunk) => {
                                setMessages(prev => prev.map(m => m.id === aiMsg.id ? { ...m, content: chunk } : m));
                            },
                            ctrl.signal
                        );
                    } catch (err) {
                        if (err.name === "AbortError") {
                            // stopped by user, keep whatever was streamed
                        } else {
                            const errMsg = {
                                id: Date.now() + 2,
                                role: "error",
                                content: err.message || "Something went wrong. Please check your API key.",
                                timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                            };
                            setMessages(prev => [...prev.filter(m => m.content !== ""), errMsg]);
                        }
                    } finally {
                        setIsThinking(false);
                        setIsStreaming(false);
                        setAbortCtrl(null);
                    }
                }, [messages, isThinking, isStreaming]);

                const handleSend = (e) => {
                    e?.preventDefault();
                    sendMessage(inputValue);
                };

                const handleKeyDown = (e) => {
                    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
                };

                const handleRegenerate = useCallback(() => {
                    const lastUser = [...messages].reverse().find(m => m.role === "user");
                    if (lastUser) {
                        setMessages(prev => prev.slice(0, prev.findIndex(m => m.id === lastUser.id) + 1));
                        setTimeout(() => sendMessage(lastUser.content), 100);
                    }
                }, [messages, sendMessage]);

                const pinnedChats = chats.filter(c => c.pinned && c.label.toLowerCase().includes(searchQuery.toLowerCase()));
                const recentChats = chats.filter(c => !c.pinned && c.label.toLowerCase().includes(searchQuery.toLowerCase()));

                return (
                    <>
                        {!apiKey && <ApiKeyModal onSave={saveKey} />}
                        <div className="flex h-screen w-full bg-background overflow-hidden">
                            {/* Mobile overlay */}
                            {isMobile && leftOpen && <div className="sidebar-overlay active" onClick={() => setLeftOpen(false)} />}

                            {/* ─── LEFT SIDEBAR ─── */}
                            <aside className={cn(
                                "flex flex-col border-r border-sidebar-border bg-sidebar shrink-0 transition-all duration-300 overflow-hidden",
                                "md:relative fixed inset-y-0 left-0 z-50",
                                "w-[280px] max-w-[85vw]",
                                leftOpen ? "translate-x-0 md:w-[280px]" : "-translate-x-full md:translate-x-0 md:w-0 md:opacity-0"
                            )}>
                                <div className="flex flex-col h-full min-w-[280px] p-4">
                                    {/* Header */}
                                    <div className="flex items-center justify-between mb-5 pl-1">
                                        <div className="flex items-center gap-2.5">
                                            <Logo />
                                            <div>
                                                <span className="text-base font-black tracking-tight text-sidebar-foreground logo-gradient">oclxn</span>
                                                <p className="text-[9px] text-muted-foreground leading-none mt-0.5">by Syed Developers</p>
                                            </div>
                                        </div>
                                        <Button variant="ghost" size="icon" onClick={() => setLeftOpen(false)} className="h-8 w-8">
                                            <PanelLeft className="w-4 h-4 text-sidebar-foreground/60" />
                                        </Button>
                                    </div>

                                    {/* New Chat */}
                                    <Button className="w-full justify-start gap-2 h-10 shadow-md mb-4 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white border-0 glow-btn" onClick={handleNewChat}>
                                        <Plus className="w-4 h-4" /> New Chat
                                    </Button>

                                    {/* Search */}
                                    <div className="relative mb-5 group">
                                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground group-focus-within:text-primary transition-colors" />
                                        <Input placeholder="Search chats..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                                            className="pl-9 pr-8 h-9 bg-sidebar-accent/50 border-sidebar-border focus:bg-background transition-all text-sm" />
                                        {searchQuery && <button onClick={() => setSearchQuery("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground">
                                            <X className="w-3.5 h-3.5" />
                                        </button>}
                                    </div>

                                    {/* Nav */}
                                    <div className="space-y-0.5 mb-5">
                                        <SidebarItem icon={MessageSquare} label="Chats" shortcut="⌘1" active={activeTab === "chats"} count={chats.length} onClick={() => setActiveTab("chats")} />
                                        <SidebarItem icon={Bookmark} label="Saved" shortcut="⌘2" active={activeTab === "saved"} onClick={() => setActiveTab("saved")} />
                                        <SidebarItem icon={Settings} label="Settings" shortcut="⌘," active={activeTab === "settings"} onClick={() => setActiveTab("settings")} />
                                    </div>

                                    {/* Chat History */}
                                    <div className="flex-1 overflow-y-auto -mx-2 px-2 space-y-4">
                                        {pinnedChats.length > 0 && (
                                            <div>
                                                <p className="text-[10px] font-semibold text-muted-foreground uppercase tracking-wider px-2 mb-1.5">Pinned</p>
                                                <div className="space-y-0.5">
                                                    {pinnedChats.map(c => (
                                                        <HistoryItem key={c.id} label={c.label} active={c.id === activeChat} isPinned
                                                            onUnpin={() => setChats(p => p.map(x => x.id === c.id ? { ...x, pinned: false } : x))}
                                                            onDelete={() => setChats(p => p.filter(x => x.id !== c.id))}
                                                            onClick={() => handleSelectChat(c.id)} />
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {recentChats.length > 0 && (
                                            <div>
                                                <p className="text-[10px] font-semibold text-muted-foreground uppercase tracking-wider px-2 mb-1.5">Recent</p>
                                                <div className="space-y-0.5">
                                                    {recentChats.map(c => (
                                                        <HistoryItem key={c.id} label={c.label} active={c.id === activeChat}
                                                            onPin={() => setChats(p => p.map(x => x.id === c.id ? { ...x, pinned: true } : x))}
                                                            onDelete={() => setChats(p => p.filter(x => x.id !== c.id))}
                                                            onClick={() => handleSelectChat(c.id)} />
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Footer */}
                                    <div className="pt-3 border-t border-sidebar-border mt-3">
                                        <div className="flex items-center gap-2.5 px-2">
                                            <div className="w-7 h-7 rounded-full bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shrink-0">
                                                <span className="text-white text-[9px] font-black">SH</span>
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <p className="text-xs font-semibold text-sidebar-foreground truncate">Syed Haider Hussein</p>
                                                <p className="text-[10px] text-muted-foreground">Syed Developers</p>
                                            </div>
                                            <Button variant="ghost" size="icon" className="h-7 w-7 shrink-0" onClick={() => setTheme(theme === "dark" ? "light" : "dark")}>
                                                {theme === "dark" ? <Sun className="w-3.5 h-3.5" /> : <Moon className="w-3.5 h-3.5" />}
                                            </Button>
                                        </div>
                                    </div>
                                </div>
                            </aside>

                            {/* ─── MAIN CHAT ─── */}
                            <div className="flex flex-col flex-1 min-w-0">
                                {/* Top bar */}
                                <header className="flex items-center justify-between px-4 h-14 border-b border-border bg-background/80 backdrop-blur-sm shrink-0 z-10">
                                    <div className="flex items-center gap-3">
                                        <Button variant="ghost" size="icon" className="h-8 w-8" onClick={() => setLeftOpen(p => !p)}>
                                            <Menu className="w-4 h-4" />
                                        </Button>
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-sm logo-gradient">oclxn</span>
                                            <Badge variant="outline" className="text-[10px] px-1.5 py-0 border-primary/30 text-primary">AI</Badge>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <div className="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-green-500/10 border border-green-500/20">
                                            <div className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                                            <span className="text-[10px] text-green-600 font-medium">Live</span>
                                        </div>
                                        <Button variant="ghost" size="icon" className="h-8 w-8" onClick={() => setTheme(theme === "dark" ? "light" : "dark")}>
                                            {theme === "dark" ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
                                        </Button>
                                        <Button variant="ghost" size="icon" className="h-8 w-8" onClick={() => setRightOpen(p => !p)}>
                                            <PanelRight className="w-4 h-4" />
                                        </Button>
                                    </div>
                                </header>

                                {/* Messages */}
                                <div ref={scrollRef} className="flex-1 overflow-y-auto">
                                    <div className="max-w-3xl mx-auto px-4 py-6 space-y-6">
                                        {messages.length === 0 ? (
                                            <WelcomeScreen onPrompt={text => { setInputValue(text); setTimeout(() => sendMessage(text), 50); }} />
                                        ) : (
                                            <>
                                                {messages.filter(m => m.content !== "" || m.role === "user").map((msg, i) => (
                                                    <ChatMessage
                                                        key={msg.id}
                                                        message={msg}
                                                        isLast={i === messages.length - 1}
                                                        isStreaming={isStreaming}
                                                        onRegenerate={handleRegenerate}
                                                    />
                                                ))}
                                                {isThinking && <ThinkingIndicator />}
                                            </>
                                        )}
                                    </div>
                                </div>

                                {/* Input */}
                                <div className="border-t border-border bg-background/80 backdrop-blur-sm px-4 py-3">
                                    <div className="max-w-3xl mx-auto">
                                        <div className="relative flex items-end gap-2 bg-card border border-border rounded-2xl shadow-sm hover:border-primary/30 focus-within:border-primary/50 focus-within:ring-2 focus-within:ring-primary/10 transition-all">
                                            <Textarea
                                                ref={textareaRef}
                                                value={inputValue}
                                                onChange={e => setInputValue(e.target.value)}
                                                onKeyDown={handleKeyDown}
                                                placeholder="Ask oclxn anything…"
                                                rows={1}
                                                className="flex-1 resize-none border-0 bg-transparent px-4 py-3.5 text-sm placeholder:text-muted-foreground focus-visible:ring-0 focus-visible:ring-offset-0 min-h-[52px] max-h-[200px] overflow-y-auto"
                                                style={{ fieldSizing: "content" }}
                                                disabled={!apiKey}
                                            />
                                            <div className="flex items-center gap-1 pr-2 pb-2">
                                                {(isThinking || isStreaming) ? (
                                                    <Button size="icon" onClick={handleStop}
                                                        className="h-9 w-9 rounded-xl bg-red-500 hover:bg-red-600 text-white border-0 shrink-0">
                                                        <StopCircle className="w-4 h-4" />
                                                    </Button>
                                                ) : (
                                                    <Button size="icon" onClick={handleSend}
                                                        disabled={!inputValue.trim() || !apiKey}
                                                        className="h-9 w-9 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white border-0 shrink-0 disabled:opacity-30 disabled:cursor-not-allowed shadow-md hover:shadow-lg transition-all">
                                                        <Send className="w-4 h-4" />
                                                    </Button>
                                                )}
                                            </div>
                                        </div>
                                        <p className="text-center text-[10px] text-muted-foreground mt-2">
                                            oclxn · <span className="font-medium">Syed Developers</span> · Created by Syed Haider Hussein · Press Enter to send
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* ─── RIGHT SIDEBAR ─── */}
                            <aside className={cn(
                                "flex flex-col border-l border-sidebar-border bg-sidebar shrink-0 transition-all duration-300 overflow-hidden",
                                rightOpen ? "w-[260px]" : "w-0 opacity-0"
                            )}>
                                <div className="flex flex-col h-full min-w-[260px]">
                                    <div className="flex items-center justify-between p-4 border-b border-sidebar-border h-14">
                                        <span className="font-semibold text-sm text-sidebar-foreground">About oclxn</span>
                                        <Button variant="ghost" size="icon" onClick={() => setRightOpen(false)} className="h-8 w-8">
                                            <X className="w-4 h-4 text-sidebar-foreground/60" />
                                        </Button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-4 space-y-5">
                                        <div className="flex flex-col items-center text-center pt-2">
                                            <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center mb-3 shadow-xl shadow-violet-500/30">
                                                <span className="text-white font-black text-xl">OX</span>
                                            </div>
                                            <h2 className="text-base font-black logo-gradient">oclxn</h2>
                                            <p className="text-xs text-muted-foreground mt-1">by Syed Developers</p>
                                            <p className="text-[11px] text-muted-foreground mt-0.5">Created by Syed Haider Hussein</p>
                                        </div>
                                        <Separator />
                                        <div className="space-y-2">
                                            <p className="text-[10px] font-semibold text-muted-foreground uppercase tracking-wider">Capabilities</p>
                                            {[
                                                { icon: Globe, label: "Web Search", desc: "Real-time internet access", color: "text-green-500" },
                                                { icon: Code, label: "Code & Debug", desc: "All programming languages", color: "text-blue-500" },
                                                { icon: Brain, label: "Reasoning", desc: "Complex analysis & math", color: "text-purple-500" },
                                                { icon: Wand2, label: "Creative", desc: "Writing & storytelling", color: "text-orange-500" },
                                            ].map((cap, i) => (
                                                <div key={i} className="flex items-center gap-3 p-2.5 rounded-lg bg-muted/50 border border-border">
                                                    <cap.icon className={cn("w-4 h-4 shrink-0", cap.color)} />
                                                    <div className="min-w-0">
                                                        <p className="text-xs font-medium text-foreground">{cap.label}</p>
                                                        <p className="text-[10px] text-muted-foreground truncate">{cap.desc}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <Separator />
                                        <div className="space-y-2">
                                            <p className="text-[10px] font-semibold text-muted-foreground uppercase tracking-wider">Status</p>
                                            <div className="flex items-center gap-2.5 p-2.5 rounded-lg bg-green-500/10 border border-green-500/20">
                                                <CheckCircle2 className="w-4 h-4 text-green-500 shrink-0" />
                                                <div>
                                                    <p className="text-xs font-medium text-foreground">API Connected</p>
                                                    <p className="text-[10px] text-muted-foreground">Claude Sonnet 4</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2.5 p-2.5 rounded-lg bg-green-500/10 border border-green-500/20">
                                                <Globe className="w-4 h-4 text-green-500 shrink-0" />
                                                <div>
                                                    <p className="text-xs font-medium text-foreground">Web Search On</p>
                                                    <p className="text-[10px] text-muted-foreground">Real-time internet</p>
                                                </div>
                                            </div>
                                        </div>
                                        <Separator />
                                        <div className="text-center">
                                            <p className="text-[10px] text-muted-foreground leading-relaxed">
                                                oclxn is an AI chat interface powered by Anthropic's Claude. Built with love by <span className="font-semibold text-foreground">Syed Haider Hussein</span> at <span className="font-semibold text-foreground">Syed Developers</span>.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </aside>
                        </div>
                    </>
                );
            }

            const root = createRoot(document.getElementById("root"));
            root.render(
                <ThemeProvider attribute="class" defaultTheme="dark" enableSystem disableTransitionOnChange>
                    <App />
                </ThemeProvider>
            );
        </script>
    </body>
</html>
