<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>oclxn - File Manager by syedevelopers</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "sans-serif"],
                        },
                    },
                },
            };
        </script>
        <style type="text/tailwindcss">
            @layer utilities {
                .focus-ring {
                    @apply focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500;
                }
                .transition-all-fast {
                    @apply transition-all duration-200 ease-in-out;
                }
                /* Custom scrollbar for a cleaner look */
                ::-webkit-scrollbar {
                    width: 8px;
                    height: 8px;
                }
                ::-webkit-scrollbar-track {
                    background: #f1f5f9; /* slate-100 */
                }
                ::-webkit-scrollbar-thumb {
                    background: #94a3b8; /* slate-400 */
                    border-radius: 10px;
                }
                ::-webkit-scrollbar-thumb:hover {
                    background: #64748b; /* slate-500 */
                }
                /* Custom styles for icon state switching from provided sidebar */
                .group.nav-active .icon-inactive,
                .group:not(.nav-active) .icon-active {
                    display: none;
                }
                .group.nav-active .icon-active,
                .group:not(.nav-active) .icon-inactive {
                    display: inline-block;
                }
            }
        </style>
    </head>

    <body class="bg-slate-100 font-sans text-slate-800 antialiased h-screen w-screen overflow-hidden flex">
        <!-- STATIC UI STRUCTURE -->

        <!-- Sidebar (New Design) -->
        <aside id="sidebar" class="w-[270px] h-screen bg-white flex flex-col border-r border-slate-200 flex-shrink-0 transition-all-fast max-lg:absolute max-lg:-translate-x-full z-30">
            <!-- Logo -->
            <div class="px-7 pt-7 pb-8 flex-shrink-0">
                <a href="#" class="flex items-center space-x-2.5">
                    <i class="fa-solid fa-cube text-violet-700 text-3xl"></i>
                    <span class="text-xl font-medium text-slate-800">Docu<span class="font-bold">Vault</span></span>
                </a>
            </div>

            <!-- Navigation Section -->
            <nav class="flex-grow px-5 flex flex-col overflow-y-auto">
                <!-- Menu Section -->
                <div>
                    <h3 class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Menu</h3>
                    <ul id="nav-menu" class="mt-2 space-y-1"></ul>
                </div>

                <!-- Usage Card Section -->
                <div id="usage-card-container" class="mt-6 px-1"></div>

                <!-- Other Section -->
                <div class="mt-auto pt-6">
                    <h3 class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Other</h3>
                    <ul id="nav-other" class="mt-2 space-y-1"></ul>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-grow flex flex-col h-full overflow-hidden">
            <!-- Header -->
            <header class="h-16 bg-white border-b border-slate-200 flex-shrink-0 flex items-center justify-between px-4 md:px-6">
                <!-- Left Section: Menu Toggle + Breadcrumbs -->
                <div class="flex items-center gap-3">
                    <button id="menu-toggle-btn" class="lg:hidden p-2 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div id="breadcrumbs" class="flex items-center gap-2 text-sm"></div>
                </div>

                <!-- Right Section: Search + View Controls + Actions -->
                <div class="flex items-center gap-2 md:gap-3">
                    <!-- Search Bar -->
                    <div class="relative hidden sm:block">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input
                            id="search-input"
                            type="text"
                            placeholder="Search files..."
                            class="w-48 lg:w-64 pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-all placeholder:text-slate-400"
                        />
                    </div>

                    <!-- Mobile Search Button -->
                    <button id="mobile-search-btn" class="sm:hidden p-2 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <!-- View Toggle Controls -->
                    <div class="flex items-center bg-slate-100 p-1 rounded-xl">
                        <div id="view-controls" class="flex items-center"></div>
                    </div>

                    <!-- Separator -->
                    <div class="w-px h-8 bg-slate-200 hidden md:block"></div>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-1">
                        <!-- New Folder Button -->
                        <button id="new-folder-btn" class="p-2 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors" title="New Folder">
                            <i class="fa-solid fa-folder-plus"></i>
                        </button>

                        <!-- Upload Button -->
                        <button id="upload-btn" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors shadow-sm">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span class="hidden md:inline">Upload</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- File Display Area -->
            <main id="file-container-wrapper" class="flex-grow overflow-y-auto p-4 md:p-6">
                <div id="quick-access-container"></div>
                <h2 id="current-folder-title" class="text-xl font-semibold text-slate-700 mt-6 mb-4"></h2>
                <div id="file-container-header" class="hidden"></div>
                <div id="file-container" class="outline-none" tabindex="-1"></div>
                <div id="selection-box" class="fixed border-2 border-blue-500 bg-blue-500 bg-opacity-20 pointer-events-none hidden z-40"></div>
            </main>
        </div>

        <!-- Preview Pane (Replaces Info Panel) -->
        <aside id="preview-pane" class="bg-white w-80 lg:w-96 h-full flex-shrink-0 border-l border-slate-200 transition-all-fast translate-x-full absolute right-0 top-0 z-20 flex flex-col">
            <div id="preview-pane-header" class="h-16 flex items-center justify-between px-4 border-b border-slate-200 flex-shrink-0"></div>
            <div id="preview-pane-content" class="flex-grow p-4 overflow-y-auto"></div>
        </aside>

        <!-- Context Menu, Modal, Notification, Drag Overlay (Unchanged) -->
        <div id="context-menu" class="hidden fixed bg-white border border-slate-200 rounded-lg shadow-xl py-2 z-50 min-w-[180px]"></div>
        <div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-md">
                <div id="modal-header" class="p-4 sm:p-6 border-b border-slate-200"><h3 id="modal-title" class="text-lg font-semibold text-slate-800"></h3></div>
                <div id="modal-body" class="p-4 sm:p-6"></div>
                <div id="modal-footer" class="p-4 sm:p-6 bg-slate-50 rounded-b-lg flex justify-end gap-3"></div>
            </div>
        </div>
        <div id="notification" class="hidden fixed bottom-5 right-5 bg-slate-800 text-white py-2 px-5 rounded-lg shadow-xl animate-fade-in-out z-50"><p id="notification-message"></p></div>
        <div id="drag-overlay" class="hidden fixed inset-0 bg-blue-500 bg-opacity-20 border-4 border-dashed border-blue-600 z-50 pointer-events-none flex items-center justify-center">
            <div class="text-center bg-white p-8 rounded-lg shadow-2xl">
                <i class="fa-solid fa-cloud-arrow-up fa-4x text-blue-500"></i>
                <p class="mt-4 text-2xl font-bold text-slate-700">Drop files to upload</p>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                // --- 1. DATA (SINGLE SOURCE OF TRUTH) ---
                let fileSystemData = [
                    {
                        id: "1",
                        parentId: null,
                        type: "folder",
                        name: "Projects",
                        dateModified: "2024-05-10T10:00:00Z",
                        dateCreated: "2023-01-15T09:00:00Z",
                        size: 0,
                        owner: "Me",
                        isFavorite: true,
                        isTrashed: false,
                    },
                    {
                        id: "2",
                        parentId: null,
                        type: "folder",
                        name: "Photos",
                        dateModified: "2024-05-12T11:30:00Z",
                        dateCreated: "2023-02-20T14:00:00Z",
                        size: 0,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                    },
                    {
                        id: "3",
                        parentId: null,
                        type: "folder",
                        name: "Documents",
                        dateModified: "2024-03-20T18:45:00Z",
                        dateCreated: "2023-03-20T18:45:00Z",
                        size: 0,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                    },
                    {
                        id: "4",
                        parentId: null,
                        type: "pdf",
                        name: "Annual Report 2023.pdf",
                        dateModified: "2024-04-25T14:20:00Z",
                        dateCreated: "2023-12-01T11:00:00Z",
                        size: 5242880,
                        owner: "Me",
                        isFavorite: true,
                        isTrashed: false,
                    },
                    {
                        id: "5",
                        parentId: null,
                        type: "jpg",
                        name: "Team Retreat.jpg",
                        dateModified: "2024-05-01T09:15:00Z",
                        dateCreated: "2024-05-01T09:15:00Z",
                        size: 8912896,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                        content: "https://images.unsplash.com/photo-1568992687947-868a62a9f521?q=80&w=1932",
                    },
                    {
                        id: "6",
                        parentId: "1",
                        type: "folder",
                        name: "Website Redesign",
                        dateModified: "2024-05-08T16:00:00Z",
                        dateCreated: "2024-02-01T13:00:00Z",
                        size: 0,
                        owner: "Me",
                        isFavorite: true,
                        isTrashed: false,
                    },
                    {
                        id: "7",
                        parentId: "1",
                        type: "docx",
                        name: "Marketing Plan.docx",
                        dateModified: "2024-04-30T12:00:00Z",
                        dateCreated: "2024-03-10T10:00:00Z",
                        size: 122880,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                    },
                    {
                        id: "8",
                        parentId: "2",
                        type: "folder",
                        name: "Vacation 2024",
                        dateModified: "2024-05-12T11:30:00Z",
                        dateCreated: "2024-05-12T11:30:00Z",
                        size: 0,
                        owner: "Jane Doe",
                        isFavorite: false,
                        isTrashed: false,
                    },
                    {
                        id: "9",
                        parentId: "2",
                        type: "png",
                        name: "Logo Concept.png",
                        dateModified: "2024-02-15T17:00:00Z",
                        dateCreated: "2024-02-14T11:00:00Z",
                        size: 2097152,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                        content: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=1974",
                    },
                    {
                        id: "10",
                        parentId: "3",
                        type: "xlsx",
                        name: "Q2 Budget.xlsx",
                        dateModified: "2024-03-20T18:45:00Z",
                        dateCreated: "2024-03-18T09:20:00Z",
                        size: 307200,
                        owner: "John Smith",
                        isFavorite: false,
                        isTrashed: false,
                    },
                    {
                        id: "11",
                        parentId: "6",
                        type: "folder",
                        name: "Assets",
                        dateModified: "2024-04-20T10:00:00Z",
                        dateCreated: "2024-04-19T14:00:00Z",
                        size: 0,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                    },
                    {
                        id: "12",
                        parentId: "6",
                        type: "txt",
                        name: "Meeting Notes.txt",
                        dateModified: "2024-05-08T16:00:00Z",
                        dateCreated: "2024-05-08T15:30:00Z",
                        size: 4096,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                        content:
                            "Q2 Planning Meeting Notes\n\nAttendees: Alex, Jane, John\n\n- Discussed marketing budget for the new campaign.\n- Reviewed preliminary designs for the website redesign.\n- Action item: Alex to finalize the project timeline by EOD Friday.",
                    },
                    {
                        id: "13",
                        parentId: null,
                        type: "zip",
                        name: "Archived Files.zip",
                        dateModified: "2024-01-10T11:00:00Z",
                        dateCreated: "2024-01-10T11:00:00Z",
                        size: 157286400,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: true,
                    },
                    {
                        id: "14",
                        parentId: "8",
                        type: "mov",
                        name: "Beach Sunset.mov",
                        dateModified: "2024-05-11T20:00:00Z",
                        dateCreated: "2024-05-11T19:45:00Z",
                        size: 262144000,
                        owner: "Me",
                        isFavorite: false,
                        isTrashed: false,
                    },
                ];

                // --- 2. HELPERS & CONFIG --- (Unchanged from previous version)
                const Helpers = {
                    formatBytes: (b, d = 2) => {
                        if (0 === b) return "0 Bytes";
                        const e = 0 > d ? 0 : d,
                            f = ["Bytes", "KB", "MB", "GB", "TB", "PB", "EB", "ZB", "YB"],
                            g = Math.floor(Math.log(b) / Math.log(1024));
                        return parseFloat((b / Math.pow(1024, g)).toFixed(e)) + " " + f[g];
                    },
                    formatDate: (d) => new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
                    getIconForType: (d) => {
                        const e = {
                            folder: { icon: "fa-folder", color: "text-blue-500" },
                            pdf: { icon: "fa-file-pdf", color: "text-red-500" },
                            jpg: { icon: "fa-file-image", color: "text-purple-500" },
                            jpeg: { icon: "fa-file-image", color: "text-purple-500" },
                            png: { icon: "fa-file-image", color: "text-purple-500" },
                            docx: { icon: "fa-file-word", color: "text-sky-600" },
                            xlsx: { icon: "fa-file-excel", color: "text-green-600" },
                            zip: { icon: "fa-file-zipper", color: "text-amber-500" },
                            txt: { icon: "fa-file-lines", color: "text-slate-500" },
                            mov: { icon: "fa-file-video", color: "text-orange-500" },
                            mp4: { icon: "fa-file-video", color: "text-orange-500" },
                            mp3: { icon: "fa-music", color: "text-pink-500" },
                            wav: { icon: "fa-music", color: "text-pink-500" },
                            default: { icon: "fa-file", color: "text-slate-500" },
                        };
                        return e[d] || e.default;
                    },
                    generateId: () => `id_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                    showNotification: (d, e = 3e3) => {
                        (UI.notificationMessage.textContent = d), UI.notification.classList.remove("hidden"), setTimeout(() => UI.notification.classList.add("hidden"), e);
                    },
                };

                // --- 3. UI ELEMENT REFERENCES ---
                const UI = {
                    sidebar: document.getElementById("sidebar"),
                    navMenu: document.getElementById("nav-menu"),
                    navOther: document.getElementById("nav-other"),
                    usageCardContainer: document.getElementById("usage-card-container"),
                    menuToggleBtn: document.getElementById("menu-toggle-btn"),
                    header: document.querySelector("header"),
                    breadcrumbs: document.getElementById("breadcrumbs"),
                    searchInput: document.getElementById("search-input"),
                    viewControls: document.getElementById("view-controls"),
                    previewToggleControl: document.getElementById("preview-toggle-control"),
                    fileContainerWrapper: document.getElementById("file-container-wrapper"),
                    fileContainer: document.getElementById("file-container"),
                    fileContainerHeader: document.getElementById("file-container-header"),
                    previewPane: document.getElementById("preview-pane"),
                    previewPaneHeader: document.getElementById("preview-pane-header"),
                    previewPaneContent: document.getElementById("preview-pane-content"),
                    contextMenu: document.getElementById("context-menu"),
                    modalOverlay: document.getElementById("modal-overlay"),
                    modalContent: document.getElementById("modal-content"),
                    modalTitle: document.getElementById("modal-title"),
                    modalBody: document.getElementById("modal-body"),
                    modalFooter: document.getElementById("modal-footer"),
                    notification: document.getElementById("notification"),
                    notificationMessage: document.getElementById("notification-message"),
                    dragOverlay: document.getElementById("drag-overlay"),
                    selectionBox: document.getElementById("selection-box"),
                    quickAccessContainer: document.getElementById("quick-access-container"),
                    currentFolderTitle: document.getElementById("current-folder-title"),
                };

                // --- 4. STATE MANAGEMENT ---
                const State = {
                    currentPathId: null, // null=root, 'favorites', 'trash', or folder ID, or a filter like 'documents'
                    currentView: "grid", // 'grid' or 'list'
                    selectedItemIds: new Set(),
                    sortBy: { key: "name", order: "asc" },
                    clipboard: { action: null, itemIds: new Set() },
                    isPreviewPaneOpen: false,
                    activePreviewTab: "info", // 'info', 'preview', 'raw'
                    currentSearchQuery: "",
                    init() {
                        this.currentView = localStorage.getItem("docuvault_view") || "grid";
                        // Preview pane always starts closed
                        this.isPreviewPaneOpen = false;
                    },
                    setCurrentPathId(id) {
                        this.currentPathId = id;
                        this.selectedItemIds.clear();
                    },
                    setView(view) {
                        this.currentView = view;
                        localStorage.setItem("docuvault_view", view);
                    },
                    togglePreviewPane() {
                        this.isPreviewPaneOpen = !this.isPreviewPaneOpen;
                    },
                    openPreviewPane() {
                        this.isPreviewPaneOpen = true;
                    },
                    closePreviewPane() {
                        this.isPreviewPaneOpen = false;
                    },
                    setActivePreviewTab(tab) {
                        this.activePreviewTab = tab;
                    },
                    toggleSelection(id) {
                        if (this.selectedItemIds.has(id)) {
                            this.selectedItemIds.delete(id);
                        } else {
                            this.selectedItemIds.add(id);
                        }
                    },
                    setSelection(ids) {
                        this.selectedItemIds = new Set(ids);
                    },
                    clearSelection() {
                        this.selectedItemIds.clear();
                    },
                    setSort(key) {
                        if (this.sortBy.key === key) {
                            this.sortBy.order = this.sortBy.order === "asc" ? "desc" : "asc";
                        } else {
                            this.sortBy.key = key;
                            this.sortBy.order = "asc";
                        }
                    },
                };
                State.init();

                // --- 5. API (Data Logic) ---
                const API = {
                    getItem: (id) => fileSystemData.find((item) => item.id === id),
                    getItemsInCurrentPath: () => {
                        const filterMap = {
                            documents: ["pdf", "docx", "xlsx", "txt"],
                            images: ["jpg", "jpeg", "png"],
                            videos: ["mov", "mp4"],
                            audios: ["mp3", "wav"],
                        };

                        if (State.currentPathId === "trash") return API.getTrashedItems();
                        if (State.currentPathId === "favorites") return API.getFavoriteItems();
                        if (State.currentSearchQuery) {
                            return fileSystemData.filter((item) => item.name.toLowerCase().includes(State.currentSearchQuery.toLowerCase()) && !item.isTrashed);
                        }
                        if (filterMap[State.currentPathId]) {
                            return fileSystemData.filter((item) => filterMap[State.currentPathId].includes(item.type) && !item.isTrashed);
                        }
                        return fileSystemData.filter((item) => item.parentId === State.currentPathId && !item.isTrashed);
                    },
                    getPath: (id) => {
                        const p = [];
                        let c = API.getItem(id);
                        while (c) {
                            p.unshift(c);
                            c = API.getItem(c.parentId);
                        }
                        return p;
                    },
                    getFavoriteItems: () => fileSystemData.filter((item) => item.isFavorite && !item.isTrashed),
                    getTrashedItems: () => fileSystemData.filter((item) => item.isTrashed),
                    getRecentItems: (limit = 4) =>
                        [...fileSystemData]
                            .filter((i) => !i.isTrashed)
                            .sort((a, b) => new Date(b.dateModified) - new Date(a.dateModified))
                            .slice(0, limit),
                    createFolder: (name, parentId) => {
                        fileSystemData.push({
                            id: Helpers.generateId(),
                            parentId,
                            type: "folder",
                            name,
                            dateModified: new Date().toISOString(),
                            dateCreated: new Date().toISOString(),
                            size: 0,
                            owner: "Me",
                            isFavorite: false,
                            isTrashed: false,
                        });
                    },
                    renameItem: (id, newName) => {
                        const i = API.getItem(id);
                        if (i) {
                            i.name = newName;
                            i.dateModified = new Date().toISOString();
                        }
                    },
                    uploadFiles: (files, parentId) => {
                        for (const f of files) {
                            fileSystemData.push({
                                id: Helpers.generateId(),
                                parentId,
                                type: f.name.split(".").pop().toLowerCase(),
                                name: f.name,
                                dateModified: new Date().toISOString(),
                                dateCreated: new Date().toISOString(),
                                size: f.size,
                                owner: "Me",
                                isFavorite: false,
                                isTrashed: false,
                            });
                        }
                    },
                    moveItems: (itemIds, targetFolderId) => {
                        itemIds.forEach((id) => {
                            const i = API.getItem(id);
                            if (i && i.parentId !== targetFolderId) {
                                i.parentId = targetFolderId;
                                i.dateModified = new Date().toISOString();
                            }
                        });
                    },
                    copyItems: (itemIds, targetFolderId) => {
                        itemIds.forEach((id) => {
                            const o = API.getItem(id);
                            if (o) {
                                const c = { ...o, id: Helpers.generateId(), parentId: targetFolderId, dateModified: new Date().toISOString(), dateCreated: new Date().toISOString() };
                                fileSystemData.push(c);
                                if (o.type === "folder") {
                                    API.copyItems(
                                        fileSystemData.filter((i) => i.parentId === o.id).map((i) => i.id),
                                        c.id
                                    );
                                }
                            }
                        });
                    },
                    toggleFavorite: (itemIds) => {
                        itemIds.forEach((id) => {
                            const i = API.getItem(id);
                            if (i) i.isFavorite = !i.isFavorite;
                        });
                    },
                    trashItems: (itemIds) => {
                        itemIds.forEach((id) => {
                            const i = API.getItem(id);
                            if (i) i.isTrashed = true;
                        });
                    },
                    restoreItems: (itemIds) => {
                        itemIds.forEach((id) => {
                            const i = API.getItem(id);
                            if (i) i.isTrashed = false;
                        });
                    },
                    deletePermanently: (itemIds) => {
                        const d = new Set(itemIds);
                        itemIds.forEach((id) => {
                            const i = API.getItem(id);
                            if (i && i.type === "folder") {
                                const f = (p) => {
                                    const c = fileSystemData.filter((x) => x.parentId === p);
                                    c.forEach((x) => {
                                        d.add(x.id);
                                        if (x.type === "folder") f(x.id);
                                    });
                                };
                                f(id);
                            }
                        });
                        fileSystemData = fileSystemData.filter((i) => !d.has(i.id));
                    },
                    getStorageStats: () => {
                        const s = fileSystemData.filter((i) => !i.isTrashed).reduce((sum, item) => sum + item.size, 0);

                        }
                    },

                            e.preventDefault();

                            State.currentSearchQuery = "";
                            UI.searchInput.value = "";
                            Renderer.renderAll();
                        }
                    },
                    onHeaderClick(e) {
                        const breadcrumb = e.target.closest(".breadcrumb-link");
                        const viewToggle = e.target.closest(".view-toggle-btn");
                        const previewToggle = e.target.closest("#preview-toggle-btn");
                        const menuToggle = e.target.closest("#menu-toggle-btn");
                        const uploadBtn = e.target.closest("#upload-btn");
                        const newFolderBtn = e.target.closest("#new-folder-btn");

                        if (breadcrumb) {
                            e.preventDefault();
                            State.setCurrentPathId(breadcrumb.dataset.pathId === "null" ? null : breadcrumb.dataset.pathId);
                            Renderer.renderAll();
                        }
                        if (viewToggle) {
                            State.setView(viewToggle.dataset.view);
                            Renderer.renderHeader();
                            Renderer.renderFiles();
                        }
                        if (previewToggle) {
                            State.togglePreviewPane();
                            Renderer.renderHeader();
                            Renderer.renderPreviewPane();
                        }
                        if (menuToggle) {
                            UI.sidebar.classList.toggle("max-lg:-translate-x-full");
                        }
                        if (uploadBtn) {
                            this.triggerFileUpload();
                        }
                        if (newFolderBtn) {
                            this.showCreateFolderModal();
                        }
                    },
                    onFileItemClick(e) {
                        const itemEl = e.target.closest(".file-item");
                        if (!itemEl) return;
                        const id = itemEl.dataset.id;
                        if (e.ctrlKey || e.metaKey) {
                            State.toggleSelection(id);
                        } else if (e.shiftKey) {
                            const i = Array.from(UI.fileContainer.querySelectorAll(".file-item")).map((el) => el.dataset.id),
                                l = [...State.selectedItemIds].pop(),
                                s = i.indexOf(l),
                                c = i.indexOf(id),
                                t = Math.min(s, c),
                                n = Math.max(s, c);
                            State.setSelection([...State.selectedItemIds, ...i.slice(t, n + 1)]);
                        } else {
                            State.setSelection([id]);
                        }

                        // Auto-open preview pane when a FILE (not folder) is selected, auto-close when nothing is selected
                        if (State.selectedItemIds.size > 0 && !State.isPreviewPaneOpen) {
                            // Check if any selected item is a file (not a folder)
                            const selectedItems = [...State.selectedItemIds].map((id) => API.getItem(id));
                            const hasFileSelected = selectedItems.some((item) => item && item.type !== "folder");
                            if (hasFileSelected) {
                                State.openPreviewPane();
                                Renderer.renderHeader();
                            }
                        } else if (State.selectedItemIds.size === 0 && State.isPreviewPaneOpen) {
                            State.closePreviewPane();
                            Renderer.renderHeader();
                        }

                        Renderer.updateSelectionVisuals();
                    },
                    onFileItemDoubleClick(e) {
                        const itemEl = e.target.closest(".file-item");
                        if (!itemEl) return;
                        const item = API.getItem(itemEl.dataset.id);
                        if (item.type === "folder" && State.currentPathId !== "trash") {
                            State.setCurrentPathId(item.id);
                            Renderer.renderAll();
                        }
                    },
                    onFileContainerMouseDown(e) {
                        const itemEl = e.target.closest(".file-item");
                        let clickTimeout = setTimeout(() => this.onFileItemClick(e), 200);
                        itemEl?.addEventListener(
                            "dblclick",
                            () => {
                                clearTimeout(clickTimeout);
                                this.onFileItemDoubleClick(e);
                            },
                            { once: true }
                        );

                        if (!itemEl && e.button === 0) {
                            const startX = e.clientX,
                                startY = e.clientY;
                            UI.selectionBox.style.left = `${startX}px`;
                            UI.selectionBox.style.top = `${startY}px`;
                            UI.selectionBox.style.width = "0px";
                            UI.selectionBox.style.height = "0px";
                            UI.selectionBox.classList.remove("hidden");
                            const onMouseMove = (moveE) => {
                                const x = Math.min(startX, moveE.clientX),
                                    y = Math.min(startY, moveE.clientY),
                                    w = Math.abs(moveE.clientX - startX),
                                    h = Math.abs(moveE.clientY - startY);
                                UI.selectionBox.style.left = `${x}px`;
                                UI.selectionBox.style.top = `${y}px`;
                                UI.selectionBox.style.width = `${w}px`;
                                UI.selectionBox.style.height = `${h}px`;
                                const s = UI.selectionBox.getBoundingClientRect(),
                                    n = new Set();
                                document.querySelectorAll(".file-item").forEach((el) => {
                                    const r = el.getBoundingClientRect();
                                    if (s.left < r.right && s.right > r.left && s.top < r.bottom && s.bottom > r.top) n.add(el.dataset.id);
                                });
                                State.setSelection([...n]);
                                Renderer.updateSelectionVisuals();
                            };
                            const onMouseUp = () => {
                                UI.selectionBox.classList.add("hidden");
                                document.removeEventListener("mousemove", onMouseMove);
                                document.removeEventListener("mouseup", onMouseUp);
                            };
                            document.addEventListener("mousemove", onMouseMove);
                            document.addEventListener("mouseup", onMouseUp);
                        }
                    },
                    onPreviewPaneClick(e) {
                        // Stop propagation to prevent global click handler from closing the pane
                        e.stopPropagation();

                        if (e.target.closest("#close-preview-pane")) {
                            if (State.isPreviewPaneOpen) {
                                State.closePreviewPane();
                                Renderer.renderHeader();
                                Renderer.renderPreviewPane();
                            }
                        }
                        const tabBtn = e.target.closest(".preview-tab-btn");
                        if (tabBtn) {
                            e.preventDefault();
                            State.setActivePreviewTab(tabBtn.dataset.tab);
                            Renderer.renderPreviewPane();
                        }
                    },
                    onContextMenu(e) {
                        e.preventDefault();
                        const itemEl = e.target.closest(".file-item");
                        let context;
                        if (itemEl) {
                            const id = itemEl.dataset.id;
                            if (!State.selectedItemIds.has(id)) {
                                State.setSelection([id]);
                                Renderer.updateSelectionVisuals();
                            }
                            context = { type: "item", id };
                        } else {
                            context = { type: "background" };
                        }
                        Renderer.renderContextMenu(e.clientX, e.clientY, context);
                    },
                    onContextMenuClick(e) {
                        const t = e.target.closest("[data-action]");
                        if (!t || t.classList.contains("opacity-50")) return;
                        const s = t.dataset.action,
                            i = State.selectedItemIds;
                        switch (s) {
                            case "create-folder":
                                this.showCreateFolderModal();
                                break;
                            case "upload-files":
                                this.triggerFileUpload();
                                break;
                            case "download":
                                this.downloadItems(i);
                                break;
                            case "toggle-favorite":
                                API.toggleFavorite(i), Renderer.renderFiles();
                                break;
                            case "rename":
                                this.showRenameModal([...i][0]);
                                break;
                            case "share":
                                this.showShareModal([...i][0]);
                                break;
                            case "copy":
                                (State.clipboard = { action: "copy", itemIds: new Set(i) }), Helpers.showNotification(`${i.size} item(s) copied.`);
                                break;
                            case "cut":
                                (State.clipboard = { action: "move", itemIds: new Set(i) }), Helpers.showNotification(`${i.size} item(s) cut.`);
                                break;
                            case "paste":
                                State.clipboard.action &&
                                    ("copy" === State.clipboard.action
                                        ? API.copyItems(State.clipboard.itemIds, State.currentPathId)
                                        : "move" === State.clipboard.action && (API.moveItems(State.clipboard.itemIds, State.currentPathId), (State.clipboard = { action: null, itemIds: new Set() })),
                                    Renderer.renderFiles());
                                break;
                            case "delete":
                                API.trashItems(i), State.clearSelection(), Renderer.renderAll(), Helpers.showNotification(`${i.size} item(s) moved to Trash.`);
                                break;
                            case "restore":
                                API.restoreItems(i), State.clearSelection(), Renderer.renderAll(), Helpers.showNotification(`${i.size} item(s) restored.`);
                                break;
                            case "delete-permanently":
                                confirm(`Are you sure you want to permanently delete ${i.size} item(s)? This action cannot be undone.`) &&
                                    (API.deletePermanently(i), State.clearSelection(), Renderer.renderAll(), Helpers.showNotification(`${i.size} item(s) permanently deleted.`));
                        }
                        Renderer.hideContextMenu();
                    },
                    onModalClick(e) {
                        if (e.target === UI.modalOverlay || e.target.closest(".modal-close-btn")) Renderer.hideModal();
                        const t = UI.modalBody.querySelector("form");
                        e.target.closest("#modal-submit-btn") && t && t.dispatchEvent(new Event("submit", { cancelable: !0, bubbles: !0 }));
                    },
                    onKeyDown(e) {
                        if ("INPUT" === e.target.tagName || "TEXTAREA" === e.target.tagName) return;
                        if ("Escape" === e.key) {
                            Renderer.hideContextMenu(), Renderer.hideModal();
                            if (State.isPreviewPaneOpen) {
                                State.togglePreviewPane();
                                Renderer.renderHeader();
                                Renderer.renderPreviewPane();
                            }
                        }
                        if (("Delete" === e.key || "Backspace" === e.key) && State.selectedItemIds.size > 0) {
                            "trash" === State.currentPathId
                                ? confirm(`Are you sure you want to permanently delete ${State.selectedItemIds.size} item(s)?`) &&
                                  (API.deletePermanently(State.selectedItemIds), Helpers.showNotification("Permanently deleted."))
                                : (API.trashItems(State.selectedItemIds), Helpers.showNotification("Moved to trash.")),
                                State.clearSelection(),
                                Renderer.renderAll();
                        }
                        if ((e.ctrlKey || e.metaKey) && "a" === e.key) {
                            e.preventDefault();
                            const t = API.getItemsInCurrentPath().map((t) => t.id);
                            State.setSelection(t), Renderer.updateSelectionVisuals();
                        }
                        if ((e.ctrlKey || e.metaKey) && "c" === e.key)
                            (State.clipboard = { action: "copy", itemIds: new Set(State.selectedItemIds) }), Helpers.showNotification(`${State.selectedItemIds.size} item(s) copied.`);
                        if ((e.ctrlKey || e.metaKey) && "x" === e.key)
                            (State.clipboard = { action: "move", itemIds: new Set(State.selectedItemIds) }), Helpers.showNotification(`${State.selectedItemIds.size} item(s) cut.`);
                        if ((e.ctrlKey || e.metaKey) && "v" === e.key && State.clipboard.action) {
                            "copy" === State.clipboard.action
                                ? API.copyItems(State.clipboard.itemIds, State.currentPathId)
                                : "move" === State.clipboard.action && (API.moveItems(State.clipboard.itemIds, State.currentPathId), (State.clipboard.action = null)),
                                Renderer.renderFiles();
                        }
                    },
                    showCreateFolderModal() {
                        Renderer.showModal(
                            "Create New Folder",
                            `<form id="create-folder-form"><label for="folder-name-input" class="block text-sm font-medium text-slate-700 mb-1">Folder Name</label><input type="text" id="folder-name-input" class="w-full border border-slate-300 rounded-lg p-2 focus-ring" required autofocus></form>`,
                            `<button class="modal-close-btn px-4 py-2 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring">Cancel</button><button id="modal-submit-btn" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus-ring">Create</button>`
                        );
                        document.getElementById("create-folder-form").addEventListener("submit", (e) => {
                            e.preventDefault();
                            const t = document.getElementById("folder-name-input");
                            t.value.trim() && (API.createFolder(t.value.trim(), State.currentPathId), Renderer.renderFiles(), Renderer.hideModal());
                        });
                    },
                    showRenameModal(t) {
                        const e = API.getItem(t);
                        Renderer.showModal(
                            "Rename Item",
                            `<form id="rename-form"><input type="text" id="rename-input" value="${e.name}" class="w-full border border-slate-300 rounded-lg p-2 focus-ring" required autofocus></form>`,
                            `<button class="modal-close-btn px-4 py-2 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring">Cancel</button><button id="modal-submit-btn" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus-ring">Save</button>`
                        );
                        document.getElementById("rename-form").addEventListener("submit", (e) => {
                            e.preventDefault();
                            const s = document.getElementById("rename-input").value.trim();
                            s && (API.renameItem(t, s), Renderer.renderAll(), Renderer.hideModal());
                        });
                    },
                    showShareModal(t) {
                        const e = API.getItem(t);
                        Renderer.showModal(
                            `Share "${e.name}"`,
                            `<div class="space-y-4"><div><label for="share-email" class="block text-sm font-medium text-slate-700 mb-1">Add people</label><input type="email" id="share-email" placeholder="Enter email address" class="w-full border border-slate-300 rounded-lg p-2 focus-ring"></div><div><label for="share-permissions" class="block text-sm font-medium text-slate-700 mb-1">Permissions</label><select id="share-permissions" class="w-full border border-slate-300 rounded-lg p-2 bg-white focus-ring"><option value="view">Can View</option><option value="edit">Can Edit</option></select></div><div class="border-t border-slate-200 pt-4"><p class="text-sm font-medium text-slate-700 mb-1">Or share a link</p><div class="flex items-center gap-2 mt-2"><input type="text" readonly value="https://docuvault.com/s/${Helpers.generateId()}" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-2 text-slate-500 text-sm"><button id="copy-link-btn" class="px-3 py-2 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring"><i class="fa-solid fa-copy"></i></button></div></div></div>`,
                            `<button class="modal-close-btn px-4 py-2 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring">Done</button><button id="modal-submit-btn" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus-ring">Share</button>`
                        );
                        document.getElementById("copy-link-btn").addEventListener("click", () => {
                            Helpers.showNotification("Link copied to clipboard!");
                        });
                    },
                    triggerFileUpload() {
                        const t = document.createElement("input");
                        (t.type = "file"),
                            (t.multiple = !0),
                            (t.onchange = (e) => {
                                API.uploadFiles(e.target.files, State.currentPathId), Renderer.renderFiles(), Helpers.showNotification(`${e.target.files.length} file(s) uploaded.`);
                            }),
                            t.click();
                    },
                    downloadItems(t) {
                        t.size === 1 ? Helpers.showNotification(`Downloading ${API.getItem([...t][0]).name}...`) : Helpers.showNotification(`Zipping and downloading ${t.size} items...`);
                    },
                    onDragEnter(e) {
                        e.preventDefault(), e.stopPropagation(), UI.dragOverlay.classList.remove("hidden");
                    },
                    onDragLeave(e) {
                        e.preventDefault(), e.stopPropagation(), null === e.relatedTarget && UI.dragOverlay.classList.add("hidden");
                    },
                    onDrop(e) {
                        e.preventDefault(), e.stopPropagation(), UI.dragOverlay.classList.add("hidden");
                        const t = e.dataTransfer.files;
                        t.length > 0 && (API.uploadFiles(t, State.currentPathId), Renderer.renderFiles(), Helpers.showNotification(`${t.length} file(s) uploaded.`));
                    },
                };

                // --- 8. INITIALIZATION ---
                function init() {
                    Handlers.init();
                    UI.searchInput.addEventListener("keyup", (e) => {
                        State.currentSearchQuery = e.target.value;
                        if (!State.currentSearchQuery) State.currentPathId = null;
                        Renderer.renderAll();
                    });
                    UI.fileContainer.addEventListener("click", (e) => {
                        const s = e.target.closest(".sortable-header");
                        if (s) {
                            State.setSort(s.dataset.sortKey);
                            Renderer.renderFiles();
                        }
                    });
                    Renderer.renderAll();
                }

                init();
            });
        </script>
    </body>
</html>
